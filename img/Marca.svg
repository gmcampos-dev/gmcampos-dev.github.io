<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 40" width="130" height="40">
  <style>
    .text {
      font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 26px;
      font-weight: 700; /* Mais negrito para destacar no fundo claro */
    }
    .main { fill: #111111; } /* Preto/Chumbo escuro */
    .symbol { fill: #111111; opacity: 0.6; } /* Preto com transparência para diferenciar os símbolos */
    .cursor { 
      fill: #F7DF1E; /* Amarelo JavaScript */
      animation: blink 1.2s step-end infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <text x="0" y="28" class="text">
    <tspan class="main">g</tspan>
    <tspan class="symbol">:~$ </tspan>
    <tspan class="cursor">█</tspan>
  </text>
</svg>